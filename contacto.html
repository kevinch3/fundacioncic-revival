<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — Fundación CIC · Trelew, Chubut</title>
<meta name="description" content="Contacto de la Fundación C.I.C., Trelew, Chubut.">
<link rel="icon" href="assets/layout/img06.jpg">
<link rel="stylesheet" href="css/style.css">
<script src="js/site.js" defer></script>
</head>
<body data-page="contacto" data-updated="15/10/09">
<main id="main" class="content"><div class="bgtop"><div class="bgbtm"><article class="post">

	<h1>Contacto</h1>

	<p><strong>Fundación “C.I.C.”</strong><br>
	Trelew, Provincia del Chubut<br>
	Patagonia Argentina<br>
	<em>fundacioncic.org</em></p>

	<form class="box" id="contacto-form" novalidate>
		<label for="c-nombre">Nombre</label>
		<input id="c-nombre" name="nombre" autocomplete="name">
		<label for="c-email">Correo electrónico</label>
		<input id="c-email" name="email" type="email" autocomplete="email">
		<label for="c-asunto">Asunto</label>
		<input id="c-asunto" name="asunto" placeholder="Inscripción al Certamen, biblioteca, prensa…">
		<label for="c-mensaje">Mensaje</label>
		<textarea id="c-mensaje" name="mensaje"></textarea>
		<button class="btn" type="submit">Enviar</button>
		<p class="formmsg" id="contacto-msg" role="status" aria-live="polite"></p>
	</form>

	<script>
	document.getElementById("contacto-form").addEventListener("submit", function (e) {
		e.preventDefault();
		document.getElementById("contacto-msg").textContent =
			"Este formulario no está activo.";
	});
	</script>

</article></div></div></main>
</body>
</html>
